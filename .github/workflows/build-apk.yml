name: Build Aura Home Release APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Accept Android SDK licenses
        run: |
          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      - name: Prepare release signing and build Release APK
        env:
          SECRET_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          SECRET_STORE_PASS: ${{ secrets.RELEASE_STORE_PASSWORD }}
          SECRET_KEY_PASS: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          KEYSTORE_FILE="/tmp/aura-release-key.jks"
          if [ -n "$SECRET_KEYSTORE_B64" ] && [ -n "$SECRET_STORE_PASS" ] && [ -n "$SECRET_KEY_PASS" ]; then
            echo "$SECRET_KEYSTORE_B64" | base64 -d > "$KEYSTORE_FILE"
            STORE_PASS="$SECRET_STORE_PASS"
            KEY_PASS="$SECRET_KEY_PASS"
          else
            STORE_PASS="aurahome-release-key"
            KEY_PASS="aurahome-release-key"
            keytool -genkeypair -v -keystore "$KEYSTORE_FILE" \
              -storepass "$STORE_PASS" -alias upload -keypass "$KEY_PASS" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Aura Home,O=AuraHome,C=ID"
          fi

          KEYSTORE_PATH="$KEYSTORE_FILE" STORE_PASSWORD="$STORE_PASS" KEY_PASSWORD="$KEY_PASS" \
            gradle :app:assembleRelease --no-daemon

          cp app/build/outputs/apk/release/app-release.apk AuraHome-release.apk
          rm -f "$KEYSTORE_FILE"

      - name: Upload Release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AuraHome-release-apk
          path: AuraHome-release.apk
          retention-days: 30

      - name: Publish Release APK to GitHub Releases
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="latest-release"
          gh release delete "$TAG" --yes || true
          gh release create "$TAG" AuraHome-release.apk \
            --title "Aura Home Release APK" \
            --notes "Signed release APK built automatically from commit ${{ github.sha }}."
